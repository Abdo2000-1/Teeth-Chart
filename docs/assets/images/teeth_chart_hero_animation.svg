<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Dark Sleek Background -->
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="60%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Glowing Lines -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Subtle Filters -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="fineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes subtleScan {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.6; }
      100% { transform: translateY(440px); opacity: 0.1; }
    }
    .scan-beam { animation: subtleScan 8s linear infinite; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#modernBg)" />
  <rect width="1200" height="440" fill="url(#fineGrid)" />

  <!-- Elegant Laser Scan -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="scan-beam" filter="url(#cleanGlow)" />

  <!-- Top Category Pill -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="340" height="30" rx="15" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" filter="url(#cleanGlow)" />
    <text x="32" y="20" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.2" class="font-mono">CLINICAL ODONTOGRAM • STANDALONE SUITE</text>
  </g>

  <!-- Main Hero Titles -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" fill="url(#headerGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" class="font-sans">
      3DDX Teeth Chart
    </text>
    <text x="0" y="40" fill="url(#neonCyan)" font-size="26" font-weight="700" letter-spacing="0.2" class="font-sans">
      2D Clinical Odontogram &amp; Parabolic Arch Engine
    </text>
    <text x="0" y="74" fill="#94a3b8" font-size="15" font-weight="400" class="font-sans">
      Interactive 32-Tooth Dentition • Parabolic Arch View • Titanium Implants • Dual ISO 3950 &amp; ADA Universal
    </text>
  </g>

  <!-- CREDITS CARDS SECTION (Clean Professional Cards) -->
  <g transform="translate(60, 230)">
    <!-- Front End Developer Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="520" height="78" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
      <circle cx="38" cy="39" r="18" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Code Icon inside circle -->
      <path d="M 33 34 L 28 39 L 33 44 M 43 34 L 48 39 L 43 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="72" y="32" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">FRONT END DEVELOPER</text>
      <text x="72" y="56" fill="#ffffff" font-size="18" font-weight="800" class="font-sans">
        Abdo Al Adawy <tspan fill="#38bdf8" font-size="13" font-weight="500">(@Abdo2000-1)</tspan>
      </text>
    </g>

    <!-- Team Leader Card -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="520" height="78" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
      <circle cx="38" cy="39" r="18" fill="rgba(168, 85, 247, 0.15)" stroke="#c084fc" stroke-width="1.5" />
      <!-- Star / Leadership Icon -->
      <polygon points="38,30 40.5,35 46,36 42,40 43,45.5 38,43 33,45.5 34,40 30,36 35.5,35" fill="#c084fc" />
      
      <text x="72" y="32" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="0.5" class="font-sans">TEAM LEADER &amp; TECHNICAL SUPERVISOR</text>
      <text x="72" y="56" fill="#ffffff" font-size="18" font-weight="800" class="font-sans">
        Eng. Aya Adel <tspan fill="#c084fc" font-size="13" font-weight="500">(Project Supervisor)</tspan>
      </text>
    </g>
  </g>

  <!-- QUICK FEATURE PILLS (Horizontal Clean Flow) -->
  <g transform="translate(60, 335)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">32 Anatomical Teeth</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="250" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Parabolic Arch Curvature</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="250" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#f59e0b" />
      <text x="36" y="26" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Titanium Surgical Implants</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(825, 0)">
      <rect x="0" y="0" width="255" height="42" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#c084fc" />
      <text x="36" y="26" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Zero-Dependency Component</text>
    </g>
  </g>

  <!-- Bottom Slim Gradient Edge -->
  <rect x="0" y="434" width="1200" height="6" fill="url(#neonCyan)" />
</svg>
